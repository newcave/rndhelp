# 정산·제안 관련 규정 지식베이스 (요약문 — 원문 아님)
# 각 항목은 공개 자료를 요약한 것이며, 실제 적용 전 원문·전문기관 공지로 확인 필요
# 2026-10-21 현행 원문(사용 기준 고시 제2026-38호, 운영규정 훈령 제22호, 혁신법 시행령)과 대조해 조항·내용 갱신
# id(K01~)는 정산 사전점검·연구비 편성 검증 등에서 근거로 참조하므로 바꾸지 않는다.
