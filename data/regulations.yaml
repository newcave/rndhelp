items:
  - id: K01
    title: 연구개발비 비목 구성 (2026 개정)
    category: 비목
    source: STD2026
    article: "제5조제1항·제2항 (연구혁신비는 2026.6.11. 시행)"
    text: >
      직접비는 인건비, 학생인건비, 연구시설·장비비, 연구재료비, 연구활동비, 연구수당, 보안수당,
      위탁연구개발비, 국제공동연구개발비, 연구개발부담비, 연구혁신비로 구성된다. 연구혁신비는 2026년 개정으로 추가되어 2026.6.11.부터 시행된다.
      간접비는 인력지원비, 연구지원비, 성과활용지원비로 구성된다.
  - id: K02
    title: 연구혁신비 계상 한도와 증빙
    category: 비목
    source: STD2026
    article: "제10조의2, 제25조의2, 제73조제1항제13호 (2026.6.11. 시행)"
    text: >
      연구재료비·연구활동비 성격의 비용(외부 전문기술 활용비 제외)을 연구혁신비로 사용할 수 있다.
      과제(단계) 시작 시점에 계상한 연구재료비와 연구활동비 합계의 10% 이내에서 계상하되, 연차별 평균 5천만원을 초과할 수 없다.
      재료 성격 건별 300만원 초과, 활동 성격 건별 50만원 초과, 인건비 성격, 국외 사용 비용은 계상할 수 없다.
      연구비통합관리시스템에 사용목적과 거래내역을 입력하면 증명자료를 갖춘 것으로 볼 수 있다.
      참여연구자만 참여하는 회의의 식비도 연구혁신비로는 계상할 수 있다. 연구혁신비 총액 증액은 사전승인 대상이다.
  - id: K03
    title: 회의비 중 식비 (2026.5.6. 개정)
    category: 연구활동비
    source: STD2026
    article: "제25조제4항, 제25조의2제6항, 부칙 제1조"
    text: >
      해당 과제의 참여연구자만 참여하는 회의에는 회의비 중 식비를 계상할 수 없다. 과제 미참여자가 참석하거나,
      같은 과제라도 소속 연구개발기관이 다른 참여연구자(주관·공동·위탁 간)가 참석한 회의는 식비 계상이 가능하다.
      종전의 사전 내부결재 요건은 삭제되었으나 회의비 증빙(내부결재문서 또는 회의록과 영수증)은 갖춘다.
      2026.6.11.부터는 참여연구자만 참여하는 회의의 식비도 연구혁신비로 계상할 수 있다.
      개정 고시는 2026.5.6.부터 시행되며 부칙에 별도 경과규정이 없으므로, 시행일 전 집행분의 적용 기준은 전문기관에 확인한다.
      별도 지침을 둔 부처·전문기관은 지침 개정 여부를 확인한다.
  - id: K04
    title: 회의비 증빙
    category: 연구활동비
    source: STD2026
    article: "제25조제5항"
    text: >
      회의비는 내부결재문서 또는 회의록과 영수증을 갖춘다. 10만원(부가세 포함) 이하는 목적·일시·장소·내용·참석자 명단이
      포함된 증명자료로 대체할 수 있다.
  - id: K05
    title: 외부 전문기술 활용비 한도
    category: 연구활동비
    source: STD2026
    article: "제25조제2항"
    text: >
      외부 전문기술 활용비는 직접비(현물 포함)의 40% 범위에서 사용한다. 중앙행정기관의 장이 인정하면 초과할 수 있다.
  - id: K06
    title: 연구수당 계상 한도
    category: 연구수당
    source: STD2026
    article: "제26조제1항·제2항·제3항·제6항·제7항"
    text: >
      연구수당은 수정인건비(현물 인건비 포함, 연구근접지원인력 인건비 제외)의 20% 범위에서 계상한다.
      참여연구자가 2명 이상이면 1인에게 계상액의 70%를 초과해 지급할 수 없다.
      단계 시작 시점 계상액보다 증액할 수 없으며, 연구개발비 총액 증액이나 연구개발기관 추가·변경 시에만 사전승인을 받아 증액할 수 있다.
      연구수당지급비율이 직접비사용비율(현물 제외)을 20%p 초과하면 계산식에 따른 초과분은 연구수당으로 사용할 수 없다.
  - id: K07
    title: 공통 계상 불가 항목
    category: 공통
    source: STD2026
    article: "제21조제4항"
    text: >
      환급 가능한 관세·부가가치세, 주류 등 유흥성 비용, 같은 비용의 중복 계상(현금·현물 중복 포함),
      같은 기간 인건비와 학생인건비 동시 계상, 계열사 간 불명확한 비용, 인정되지 않은 임차료 등은 계상할 수 없다.
  - id: K08
    title: 연구인력 지원비 불인정 항목
    category: 연구활동비
    source: STD2026
    article: "제25조제14항"
    text: >
      참여연구자·연구근접지원인력이 아닌 자에 대한 비용, 종신 학회비, 과제와 무관한 학회·세미나 참가비와 교육훈련비,
      학위과정 비용, 환급 가능한 교육비, 평일 점심이나 식비가 포함된 출장일의 식대 등은 인정되지 않는다.
  - id: K09
    title: 현물의 정의와 범위
    category: 현물
    source: ENV_RULE
    article: "제2조제1항제12호, 별표 2 제3호 (사용기준 제2조제9호)"
    text: >
      현물은 기관부담연구개발비 중 연구자 인건비, 연구시설·장비비, 기술도입비·연구재료비를 현금가치로 환산한 금액이다.
      운영규정 별표 2는 현물 사용용도에 소프트웨어 활용비를 포함한다.
      현물 인건비는 기관부담연구개발비가 아닌 비용으로 고용한 소속 연구자의 인건비에 한한다.
      현물 부담액은 간접비 산정 기준인 수정직접비에서 제외된다.
  - id: K10
    title: 타 국가R&D로 구축한 장비의 현물 계상
    category: 현물
    source: KEITI_QA
    article: "사례집, 사용기준 제66조제1항·제3항"
    text: >
      KEITI 사례집은 다른 국가연구개발사업 예산으로 구축한 장비의 현물 계상을 원칙적으로 불가로 안내한다.
      사용기준은 국가연구개발사업으로 구축한 장비를 현물로 계상하는 경우 ZEUS 등록을 요건으로 정한다.
      영리기관은 구입가의 20% 이내, 구입 완료일이 과제 시작일의 5년 이내, 내용연수 미만료 요건도 갖춘다. 계상 전 전문기관에 확인한다.
  - id: K11
    title: 계획서에 없던 내부 보유 장비 사용
    category: 현물
    source: STD2026
    article: "제21조제4항제5호, 제22조제1항, 제23조제4항, 제66조제1항"
    text: >
      연구개발기관 내부에서 발생하는 비용은 원칙적으로 계상할 수 없다. 비영리기관 공동활용 장비 사용료, 자체 분석기관 시험분석 비용 등은 예외이며,
      영리기관은 내부 시험·분석 비용을 현물로 계상할 수 있다. 영리기관 보유 장비는 사용료가 아니라 구입가 20% 이내의 현물로 계상한다.
      연구개발비는 계상한 바에 따라 사용하므로 계획서에 없던 장비·공간은 변경 절차를 거친다.
      3천만원 이상 장비는 구입 전 ZEUS에서 공동활용 가능 여부를 확인한다.
  - id: K12
    title: 내부 장비 임차료(사용료) 지급
    category: 현물
    source: STD2026
    article: "제21조제4항제5호·제7호"
    text: >
      연구개발기관 내부 및 같은 과제를 수행하는 기관 간에 발생하는 비용(내부 장비·시설 사용료, 구입·임차 비용 포함)은 계상할 수 없다.
      비영리기관 공동활용 장비, 시험·분석 비용, 단독 판매처 등 중앙행정기관의 장이 인정하는 경우는 예외이다.
      중앙행정기관의 장이 인정하지 않은 내부·외부 연구공간 임차료도 계상할 수 없다.
  - id: K13
    title: 기관부담 연구개발비 비율 (공기업)
    category: 제안
    source: RND_DECREE
    article: "시행령 제19조제1항제3호·제3항·제5항, 별표 1; 운영규정 제32조, 별표 2; 사용기준 제60조제2항"
    text: >
      공기업·대기업은 정부지원 50% 이하, 기관부담 50% 이상이며 기관부담 중 현금은 15% 이상이다.
      기관부담 현금은 협약에서 정한 기한, 정함이 없으면 연차별 연구개발기간 종료 3개월 전까지 납부해야 하며,
      미부담 시 정부지원연구개발비 지급이 중지될 수 있다.
  - id: K14
    title: 사용실적보고 기한과 제출서류
    category: 정산
    source: ENV_RULE
    article: "제35조제1항 (혁신법 시행령 제25조, 제26조제1항; 사용기준 제80조제7항·제8항)"
    text: >
      단계(과제) 종료일부터 3개월 이내에 연구비통합관리시스템에서 사용실적보고서를 작성해 제출한다.
      자체 회계감사 의견서, 현물부담 확인서(현물 부담 시), 자체규정(자체규정 적용 시)을 함께 제출한다.
      연도별 사용내역은 연도별 연구개발기간 종료 후 1개월 이내에 연구비통합관리시스템에 등록하여 보고한다.
  - id: K15
    title: 정산 결과 이의신청과 회수금 반납
    category: 정산
    source: ENV_RULE
    article: "제35조제7항~제9항"
    text: >
      정산 결과 통보일부터 1개월 이내 1회에 한해 이의신청할 수 있고, 필요한 경우 행정위원회 심의를 거쳐 최종정산액을 확정한다.
      회수금은 통보일부터 1개월 이내 반납한다.
  - id: K16
    title: 간접비 회수 기준
    category: 정산
    source: ENV_RULE
    article: "제35조제6항제3호 (혁신법 시행령 제26조제5항제3호)"
    text: >
      직접비 집행비율이 50% 이하인 과제에서 간접비 집행비율이 직접비 집행비율을 초과하면,
      간접비 총액 × (간접비 집행비율 − 직접비 집행비율)을 회수한다.
  - id: K17
    title: 증빙 보관과 현금 지출 제한
    category: 정산
    source: ENV_RULE
    article: "제34조제2항·제3항·제4항·제7항 (사용기준 제72조제1항)"
    text: >
      지출 근거 증명자료를 갖추어야 하며, 연구비통합관리시스템에 등록한 증명자료는 갖춘 것으로 본다.
      증명자료는 과제(단계) 종료 후 5년간 보관한다. 현금 지출은 연구개발비카드·계좌이체가 불가능한 경우에만 허용된다.
      협약기간 내 지출원인행위가 없는 사용잔액은 회수를 원칙으로 하되, 전문기관의 장이 인정하면 예외로 한다.
  - id: K18
    title: 3천만원 이상 연구시설·장비 변경
    category: 연구시설·장비비
    source: ENV_RULE
    article: "제29조제2항제9호, 제3항 (사용기준 제73조제1항제5호)"
    text: >
      원래계획에 반영되지 않은 3천만원(부가세·부대비용 포함) 이상 연구시설·장비를 새로 구입·임차하거나,
      반영된 3천만원 이상 장비를 변경 구입·임차하거나 구입·임차하지 않으려면 사전 승인을 받는다.
      환율·물가 등 불가피한 사유로 원래계획 금액의 20% 이내에서 증감하는 변경은 승인 대상에서 제외된다.
      이 승인은 연구개발과제평가단 심의를 거친다.
  - id: K19
    title: 연구재료 검수 간소화 (대학·출연연 한정)
    category: 연구재료비
    source: STD2026
    article: "제22조제3항"
    text: >
      연구시설·장비와 연구재료는 기관 자체규정에 따라 구매·검수한다. 대학, 과학기술분야 정부출연연구기관, 특정연구기관은
      100만원 이하 연구재료(연차별 1,000만원 이내)의 검수를 간소화하는 자체규정을 둘 수 있다. 공기업 등 영리기관에는 이 특례가 적용되지 않는다.
  - id: K20
    title: 장비 구입·설치 완료 기한
    category: 연구시설·장비비
    source: STD2026
    article: "제23조제6항·제7항"
    text: >
      연구시설·장비는 과제(단계) 종료일 2개월 전까지 구입·설치 또는 임차를 완료해야 계상할 수 있다.
      재난 등 중대한 사유로 중앙행정기관의 장이 인정하면 1개월 전, 장비 구축이 주목적인 과제나 기본사업은 종료일까지로 한다.
      구축이 여러 단계에 걸치면 중앙행정기관의 장이 인정하는 경우 구축 완료 단계의 종료일을 적용할 수 있다.
  - id: K21
    title: 위탁연구개발비 한도
    category: 위탁
    source: STD2026
    article: "제27조제1항·제3항, 제73조제1항제7호 (운영규정 제29조제2항제11호)"
    text: >
      위탁연구개발비는 직접비에서 위탁연구개발비·국제공동연구개발비·연구개발부담비를 제외한 금액의 40%를 초과하여 계상할 수 없다.
      중앙행정기관의 장이 인정하면 초과할 수 있다. 원래계획보다 20% 이상 증액하려면 사전 승인을 받는다.
  - id: K22
    title: 연구개발계획서 표준 구성
    category: 제안
    source: RND_DECREE
    article: "시행령 제9조제2항·제3항; 시행규칙 제2조제1호(별지 제1호서식)"
    text: >
      연구개발계획서에는 필요성, 목표, 추진 전략·방법 및 체계, 성과 활용방안 및 기대효과, 연구개발비 사용 개괄 계획,
      연구책임자의 주요 연구실적, 연구책임자의 국가연구개발과제 신청·수행 현황, 국외지원사항이 포함돼야 한다.
      표준 서식은 혁신법 시행규칙 별지 제1호서식이며, 세부 항목은 전문기관 공고별로 다르므로 공고문 첨부 서식을 우선한다.
